name: smoke
description: Hit OM Trans Inbox — 5 freights + 3 orders (use --dry-run to skip HTTP)
target:
  baseUrl: ${TARGET_BASE_URL:-http://127.0.0.1:3000}
  headers:
    Authorization: Bearer ${TRANS_SIM_TOKEN:-dev-token}
    X-Trans-Sim: "1"
    # Optional: match logged-in tenant for SSE live updates on /backend/trans_inbox
    X-Om-Tenant-Id: ${TRANS_INBOX_TENANT_ID:-}
  pathMap:
    "POST /ext/freights-api/v2/freights": /api/integrations/trans/webhooks/freight
    "POST /ext/orders-api/v1/orders": /api/integrations/trans/webhooks/order
defaults:
  concurrency: 5
  timeoutMs: 10000
  dryRun: false
batches:
  - id: freights
    count: 5
    template: freight.create.public
    vars:
      currency: eur
      contactEmployees: ["105-1"]
  - id: orders
    count: 3
    template: order.event.created
    vars:
      currency: eur
reportPath: tools/trans-api-simulator/.reports/smoke.ndjson
