name: load-freights
description: Burst of mock freight creates against Open Mercato webhook sink
target:
  baseUrl: ${TARGET_BASE_URL:-http://127.0.0.1:3000}
  headers:
    Authorization: Bearer ${TRANS_SIM_TOKEN:-dev-token}
    Content-Type: application/json
    X-Om-Tenant-Id: ${TRANS_INBOX_TENANT_ID:-}
  pathMap:
    "POST /ext/freights-api/v2/freights": /api/integrations/trans/webhooks/freight
    "POST /ext/freights-api/v2/freight-companies": /api/integrations/trans/webhooks/freight
defaults:
  concurrency: 25
  rps: 40
  timeoutMs: 20000
  retries: 1
  retryBackoffMs: 300
batches:
  - id: public-freights
    count: 200
    concurrency: 30
    template: freight.create.public
    vars:
      currency: eur
  - id: companies-freights
    count: 50
    concurrency: 10
    template: freight.create.companies
    vars:
      currency: pln
      carrierCompanyId: 1028504
reportPath: tools/trans-api-simulator/.reports/load-freights.ndjson
