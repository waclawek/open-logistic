name: every-3s
description: Every 3s fire a small Trans.eu batch into OM inbox (ctrl+c to stop)
target:
  baseUrl: ${TARGET_BASE_URL:-http://127.0.0.1:3001}
  headers:
    Authorization: Bearer ${TRANS_SIM_TOKEN:-dev-token}
    X-Trans-Sim: "1"
    X-Om-Tenant-Id: ${TRANS_INBOX_TENANT_ID:-}
  pathMap:
    "POST /ext/freights-api/v1/freights": /api/integrations/trans/webhooks/freight
    "POST /ext/freights-api/v2/freights": /api/integrations/trans/webhooks/freight
    "POST /ext/orders-api/v1/orders": /api/integrations/trans/webhooks/order
defaults:
  concurrency: 4
  rps: 20
  timeoutMs: 10000
schedule:
  mode: interval
  every: 3s
batches:
  - id: freights
    count: 2
    template: freight.event.created
    vars:
      currency: eur
  - id: orders
    count: 1
    template: order.event.created
parallelBatches: true
reportPath: tools/trans-api-simulator/.reports/every-3s.ndjson
