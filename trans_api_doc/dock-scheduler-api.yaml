openapi: 3.0.0
info:
  title: dock-scheduler-api
  description: ""
  version: 1.113.4
  contact: {}
servers:
  - url: https://api.platform.trans.eu
    description: PROD
tags: []
paths:
  /ext/dock-scheduler-api/v2/time-window:
    get:
      description: 'For a shipper, the method returns all its time windows. For a
        carrier, the method returns all the time windows assigned to it. For
        paging, the method uses parameters: limit and offset. Offset is numbered
        from 0. Default offset is 0. Limit can start from 1. Default limit is
        25. The method returns a time windows list ("content") and pagination
        metadata: page, page_count, total_items, page_size. Time windows can be
        filtered using the parameter "filter" and sorted using the parameter
        "sort".'
      operationId: TimeWindowV2Controller_getTimeWindowCollection
      parameters:
        - name: filter
          required: false
          in: query
          description: URL-encoded JSON filter object
          schema:
            example: "%7B%22date_from%22%3A%222023-02-13%22%7D"
            type: string
        - name: sort
          required: false
          in: query
          description: URL-encoded JSON sort object
          schema:
            example: "%7B%22field%22%3A%22DATE%22%2C%22order%22%3A%22DESC%22%7D"
            type: string
        - name: offset
          required: false
          in: query
          description: The offset from which to start the list. Default is 0.
          schema:
            minimum: 0
            default: 0
            example: 0
            type: number
        - name: limit
          required: false
          in: query
          description: The maximum number of announcements to return. Default is 25.
          schema:
            minimum: 1
            default: 25
            example: 25
            type: number
        - name: count_matches
          required: false
          in: query
          description: If true then response is extended by matching results count.
          schema:
            default: false
            example: true
            type: boolean
      responses:
        "200":
          description: List of time windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowCollectionResponseV2Dto"
        "400":
          description: "It's only allowed to search for time windows in warehouses that
            does belong to searcher (companyId: {companyId})"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowBadRequestDto"
        "404":
          description: Time window not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowNotFoundDto"
      security:
        - bearer: []
      summary: The method returns time windows list by filter
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/time-window/{id}:
    get:
      operationId: TimeWindowV2Controller_getTimeWindowEntity
      parameters:
        - name: id
          required: true
          in: path
          description: Time window ID. Must be positive number
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 98033
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowEntityResponseV2Dto"
        "403":
          description: "Required authority: READ_OWN_TW or READ_ASSIGNED_TW"
        "404":
          description: Time window not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowNotFoundDto"
      security:
        - bearer: []
      summary: The method returns details of time window with transport
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/time-window/{id}/possible:
    get:
      operationId: TimeWindowV2Controller_getTimeWindowPossible
      parameters:
        - name: id
          required: true
          in: path
          description: Time window ID. Must be positive number
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 98033
        - name: date_from
          required: true
          in: query
          schema:
            type: string
        - name: date_to
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PossibleTimeWindowResponseV2Dto"
      security:
        - bearer: []
      summary: The method returns possible time windows
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/warehouse:
    get:
      description: For a shipper, the method returns all its warehouses. For a
        carrier, the method returns active warehouses in which the carrier has a
        announcement or an available time window. Warehouses can be filtered
        using the parameter "filter". Warehouses can be sorted using the
        parameter "sort". Endpoint supports limit and offset parameters. Default
        respectively 25 and 0.
      operationId: WarehouseV2Controller_getWarehouseCollection
      parameters:
        - name: filter
          required: false
          in: query
          description: URL-encoded JSON filter object
          schema:
            example: "%7B%22is_active%22%3Afalse%2C%22operation_type%22%3A%22loading%22%7D"
            type: string
        - name: sort
          required: false
          in: query
          description: URL-encoded JSON sort ARRAY
          schema:
            example: "%5B%7B%22field%22%3A%22NAME%22%2C%22order%22%3A%22ASC%22%7D%5D"
            type: string
        - name: offset
          required: false
          in: query
          description: The offset from which to start the list of announcements. Default
            is 0.
          schema:
            minimum: 0
            default: 0
            example: 0
            type: number
        - name: limit
          required: false
          in: query
          description: The maximum number of announcements to return. Default is 25.
          schema:
            minimum: 1
            default: 25
            example: 25
            type: number
      responses:
        "200":
          description: List of warehouses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseCollectionResponseV2Dto"
        "403":
          description: "Required authority: READ_AVAILABLE or READ_COMPANY"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
        - bearer: []
      summary: Get warehouses
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/announcement/search:
    get:
      operationId: AnnouncementV2Controller_getAnnouncementCollection
      parameters:
        - name: filter
          required: false
          in: query
          description: URL-encoded JSON filter object
          schema:
            example: "%7B%22date_from%22%3A%222025-12-02%22%7D"
            type: string
        - name: sort
          required: false
          in: query
          description: URL-encoded JSON sort object
          schema:
            example: "%7B%22field%22%3A%22DATE%22%2C%22order%22%3A%22ASC%22%7D"
            type: string
        - name: offset
          required: false
          in: query
          schema:
            minimum: 0
            default: 0
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            default: 25
            type: number
        - name: count_matches
          required: false
          in: query
          schema:
            default: false
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementCollectionResponseV2Dto"
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/announcement/{id}:
