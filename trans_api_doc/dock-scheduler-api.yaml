          description: Whether operation belongs to time window
          example: true
      required:
        - operation_type
        - order
        - belongs_to_time_window
    TimeWindowSpotInputDto:
      type: object
      properties:
        order:
          type: number
          description: Spot order
          example: 1
        warehouse_id:
          type: number
          description: Warehouse ID (alternative to inline address)
          example: 1545
        address:
          description: Inline address (alternative to warehouse_id)
          allOf:
            - $ref: "#/components/schemas/TimeWindowSpotAddressInputDto"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/TimeWindowSpotOperationInputDto"
      required:
        - order
        - operations
    TimeWindowRouteInputDto:
      type: object
      properties:
        spots:
          description: Route spots with warehouse_id or inline address
          type: array
          items:
            $ref: "#/components/schemas/TimeWindowSpotInputDto"
      required:
        - spots
    TimeWindowWritePayloadV1Dto:
      type: object
      properties:
        valid_from:
          type: string
          description: Valid from date (YYYY-MM-DD)
          example: 2021-03-23
        valid_to:
          type: string
          description: Valid to date (YYYY-MM-DD)
          example: 2021-03-23
        start_time:
          type: string
          description: Start time (HH:MM:SS)
          example: 09:00:00
        remarks:
          type: string
          description: Remarks
          example: Be Carefully
        range_type:
          type: string
          description: Range type
          example: CYCLE
        external_number:
          type: string
          description: External number
          example: 1DX124DAW
        external_source:
          type: string
          description: External source
          example: 1_external
        carrier:
          description: Carrier with id (registered) or inline data (external)
          allOf:
            - $ref: "#/components/schemas/TimeWindowCarrierInputDto"
        route:
          $ref: "#/components/schemas/TimeWindowRouteInputDto"
        operation_time:
          type: string
          description: Operation time (ISO 8601 duration)
          example: PT30M
        end_time:
          type: string
          description: End time (HH:MM:SS)
          example: 18:00:00
        purchase_order:
          type: object
          description: Purchase order payload forwarded to dock-scheduler backend
            (passthrough, not validated)
        callback_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Callback URL for async notifications
          example: http://example.com/msg
      required:
        - valid_from
        - valid_to
        - start_time
        - remarks
        - range_type
        - external_number
        - external_source
        - carrier
        - route
