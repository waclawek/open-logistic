      tags:
        - dock-scheduler-api
    patch:
      operationId: AnnouncementV2Controller_updateAnnouncement
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdatePayloadV2Dto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementResponseV2Dto"
      security:
        - bearer: []
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/announcement:
    post:
      operationId: AnnouncementV2Controller_createAnnouncement
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreatePayloadV2Dto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementResponseV2Dto"
        "400":
          description: Features MULTIPLE_TW_ASSIGNMENT not available
      security:
        - bearer: []
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v1/announcement:
