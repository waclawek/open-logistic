  /ext/dock-scheduler-api/v1/warehouse/{id}:
    get:
      operationId: WarehouseV1Controller_getWarehouseEntity
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseEntityResponseV1Dto"
      security:
        - bearer: []
      summary: Get warehouse by id
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v1/warehouse/timeWindow:
    get:
      operationId: WarehouseTimeWindowV1Controller_getTimeWindowCollection
      parameters:
        - name: filter
          required: false
          in: query
          description: URL-encoded JSON filter object
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: URL-encoded JSON sort object
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: size
          required: false
          in: query
          schema:
            minimum: 1
            default: 10
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowCollectionResponseV1Dto"
      security:
        - bearer: []
      summary: Get warehouse time window collection
      tags:
        - dock-scheduler-api
    post:
      operationId: WarehouseTimeWindowV1Controller_createTimeWindow
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeWindowWritePayloadV1Dto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowEntityResponseV1Dto"
      security:
        - bearer: []
      summary: Create warehouse time window
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v1/warehouse/timeWindow/{id}:
    get:
      operationId: WarehouseTimeWindowV1Controller_getTimeWindowEntity
      parameters:
        - name: id
          required: true
          in: path
          description: Time window ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowEntityResponseV1Dto"
      security:
        - bearer: []
      summary: Get warehouse time window entity
      tags:
        - dock-scheduler-api
    patch:
      operationId: WarehouseTimeWindowV1Controller_updateTimeWindow
      parameters:
        - name: id
          required: true
          in: path
          description: Time window ID
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeWindowWritePayloadV1Dto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
      summary: Update warehouse time window
      tags:
        - dock-scheduler-api
    delete:
      operationId: WarehouseTimeWindowV1Controller_deleteTimeWindow
      parameters:
        - name: id
          required: true
          in: path
          description: Time window ID
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: include-announcement
          required: false
          in: header
          description: When set to true, also deletes linked announcement
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "204":
          description: Time window deleted successfully
      security:
        - bearer: []
      summary: Delete warehouse time window
      tags:
        - dock-scheduler-api
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CoordinatesV1Dto:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required:
        - latitude
        - longitude
    GeoCoordinatesDto:
      type: object
      properties:
        latitude:
          type: number
          description: Latitude coordinate.
          example: 50.391594
        longitude:
          type: number
          description: Longitude coordinate.
          example: 16.03629
      required:
        - latitude
        - longitude
    AddressDetailsDto:
      type: object
      properties:
        street:
          type: string
          description: Street name.
          example: Bezručova
        number:
          type: string
          description: Building number.
          example: "265"
        locality:
          type: string
          description: Locality/City name.
          example: Česká Skalice
        postal_code:
          type: string
          description: Postal code.
          example: "55203"
        country:
          type: string
          description: Country code (e.g., 14_czech_republic).
          example: 14_czech_republic
        coordinates:
          nullable: true
          default: null
          description: Geographic coordinates.
          allOf:
            - $ref: "#/components/schemas/GeoCoordinatesDto"
        description:
          type: string
          nullable: true
          description: Address description.
        remarks:
          type: string
          nullable: true
          description: Remarks/additional notes.
      required:
        - street
        - number
        - locality
        - postal_code
        - country
        - description
        - remarks
    RouteSummaryDto:
      type: object
      properties:
        loading_place:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AddressDetailsDto"
        unloading_place:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AddressDetailsDto"
      required:
        - loading_place
        - unloading_place
    CompanyDetailsDto:
      type: object
      properties:
        id:
          type: number
          description: Internal entity ID.
          example: 1168557
        telephone:
          type: string
          nullable: true
          description: Company telephone number.
          example: (0048) 7490415385
        email:
          type: string
          nullable: true
          description: Company email address.
          example: awladyka@trans.eu
        address:
          nullable: true
          description: Company registered address.
          allOf:
            - $ref: "#/components/schemas/AddressDetailsDto"
        type:
          type: string
          nullable: true
          description: Company type.
          example: REGISTERED
        legal_name:
          type: string
          description: Company legal name.
          example: TFF przewoźnik + p44
      required:
        - id
        - legal_name
    WarehouseConfigurationDto:
      type: object
      properties:
        slot:
          type: number
          description: Number of slots.
          example: 5
        id:
          type: number
          description: Configuration ID.
          example: 16111
        valid_from:
          type: string
          description: Configuration valid from date (YYYY-MM-DD).
          example: 2024-12-19
        valid_until:
          type: string
          nullable: true
          description: Configuration valid until date (YYYY-MM-DD).
        quantity_of_slots:
          type: number
          description: Quantity of slots defined.
          example: 1
      required:
        - slot
        - id
        - valid_from
        - valid_until
        - quantity_of_slots
    TimeZoneInfoDto:
      type: object
      properties:
        id:
          type: string
          description: Time zone ID.
          example: Europe/Prague
        offset:
          type: string
          description: Time zone offset string.
          example: +01:00
        offset_minutes:
          type: number
          description: Time zone offset in minutes.
          example: 60
      required:
        - id
        - offset
        - offset_minutes
    WarehouseDetailsDto:
      type: object
      properties:
        id:
          type: number
          description: Warehouse ID.
          example: 13745
        configurations:
          description: List of slot configurations.
          type: array
          items:
            $ref: "#/components/schemas/WarehouseConfigurationDto"
        name:
          type: string
          description: Warehouse name.
          example: Załadunek1
        is_active:
          type: boolean
          description: Is the warehouse active?
          example: true
        is_locked:
          type: boolean
          description: Is the warehouse locked?
          example: false
        address:
          description: Warehouse physical address.
          allOf:
            - $ref: "#/components/schemas/AddressDetailsDto"
        operation_time:
          type: string
          description: Operation duration (ISO 8601).
          example: PT30M
        operation_type:
          type: string
          description: Type of operation.
          example: loading
        time_zone:
          description: Time zone details.
          allOf:
            - $ref: "#/components/schemas/TimeZoneInfoDto"
        announcement_template:
          type: object
          properties:
            id:
              type: number
          required:
            - id
      required:
        - id
        - name
        - is_active
        - is_locked
        - address
        - operation_time
        - operation_type
        - time_zone
        - announcement_template
    ForwardPermissionsDto:
      type: object
      properties:
        allow:
          type: boolean
          description: Allow forwarding.
          example: true
        disallow:
          type: object
          nullable: true
