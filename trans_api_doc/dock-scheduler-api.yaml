  /ext/dock-scheduler-api/v1/warehouse:
    get:
      operationId: WarehouseV1Controller_getWarehouseCollection
      parameters:
        - name: filter
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/WarehouseFilterV1Dto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarehouseCollectionItemV1Dto"
      security:
        - bearer: []
      summary: Get warehouse collection
      tags:
