  /ext/dock-scheduler-api/v2/time-window:
    get:
      description: 'For a shipper, the method returns all its time windows. For a
        carrier, the method returns all the time windows assigned to it. For
        paging, the method uses parameters: limit and offset. Offset is numbered
        from 0. Default offset is 0. Limit can start from 1. Default limit is
        25. The method returns a time windows list ("content") and pagination
        metadata: page, page_count, total_items, page_size. Time windows can be
        filtered using the parameter "filter" and sorted using the parameter
        "sort".'
      operationId: TimeWindowV2Controller_getTimeWindowCollection
      parameters:
        - name: filter
          required: false
          in: query
          description: URL-encoded JSON filter object
          schema:
            example: "%7B%22date_from%22%3A%222023-02-13%22%7D"
            type: string
        - name: sort
          required: false
          in: query
          description: URL-encoded JSON sort object
          schema:
            example: "%7B%22field%22%3A%22DATE%22%2C%22order%22%3A%22DESC%22%7D"
            type: string
        - name: offset
          required: false
          in: query
          description: The offset from which to start the list. Default is 0.
          schema:
            minimum: 0
            default: 0
            example: 0
            type: number
        - name: limit
          required: false
          in: query
          description: The maximum number of announcements to return. Default is 25.
          schema:
            minimum: 1
            default: 25
            example: 25
            type: number
        - name: count_matches
          required: false
          in: query
          description: If true then response is extended by matching results count.
          schema:
            default: false
            example: true
            type: boolean
      responses:
        "200":
          description: List of time windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowCollectionResponseV2Dto"
        "400":
          description: "It's only allowed to search for time windows in warehouses that
            does belong to searcher (companyId: {companyId})"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowBadRequestDto"
        "404":
          description: Time window not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeWindowNotFoundDto"
      security:
        - bearer: []
      summary: The method returns time windows list by filter
      tags:
        - dock-scheduler-api
  /ext/dock-scheduler-api/v2/time-window/{id}:
    get:
      operationId: TimeWindowV2Controller_getTimeWindowEntity
      parameters:
        - name: id
          required: true
          in: path
          description: Time window ID. Must be positive number
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 98033
      responses:
        "200":
