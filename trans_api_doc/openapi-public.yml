components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    TokenResponseDto:
      type: object
      properties:
        access_token:
          type: string
          description: Access token
        expires_in:
          type: number
          description: Token expiration time in seconds
        refresh_token:
          type: string
          description: Refresh token
        token_type:
          type: string
          description: Token type
      required:
        - access_token
        - token_type
    TokenExchangeRequestDto:
      type: object
      properties:
        subject_token:
          type: string
          description: JWT token to exchange
        grant_type:
          type: string
          description: grant_type
        state:
          type: string
          description: state
        requested_token_type:
          type: string
          description: requested_token_type
        subject_token_type:
          type: string
          description: subject_token_type
        resource:
          type: string
          description: resource
        audience:
          type: string
          description: audience
        scope:
          type: string
          description: scope
        client_id:
          type: string
          description: client_id
        client_secret:
          type: string
          description: client_secret
      required:
        - subject_token
        - grant_type
        - state
    TokenExchangeResponseDto:
      type: object
      properties:
        redirect_uri:
          type: string
          description: Redirect URI for SSO authentication
      required:
        - redirect_uri
    ExchangesCollectionDtoV1Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
      required:
        - id
        - name
        - type
        - created_at
