                  - id: b4c2d5e6-7f8a-9b0c-1d2e-3f4a5b6c7d8e
                    type: baf
                    kind: grid
                    currency: eur
                    description: Fuel surcharge tiered percentage
                    schedules:
                      - data:
                          matrix:
                            - ratio:
                                from: 1
                                to: 2
                              unit: percentage
                              value: 5
                            - ratio:
                                from: 2
                                to: 4
                              unit: percentage
                              value: 5.5
                          value: 5
                        timespan:
                          from: 2032-08-11T00:00:00+02:00
