  /ext/vehicles-api/v1/vehicles:
    post:
      description: Creates a vehicle offer with loading/unloading places, cargo
        metrics and availability window. Coordinates are enriched via geocoder
        when missing and contact persons are resolved to account ids.
      operationId: VehiclesManageV1Controller_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequestV1Dto"
      responses:
        "202":
          description: Vehicle offer accepted for processing (entity-shaped response; see
            internal mapping layer for fields).
        "400":
          description: Bad request - validation failed
        "401":
          description: Unauthorized - authentication required
        "422":
          description: Validation error - input data validation failed
      security:
        - bearer: []
      summary: Create vehicle offer
      tags:
        - vehicles-api
    get:
      operationId: VehiclesReadV1Controller_getVehiclesCollection
      parameters:
        - name: limit
          required: false
          in: query
          description: Maximum number of items to return
          schema:
            minimum: 1
            default: 20
            type: number
        - name: offset
          required: false
          in: query
          description: Number of items to skip
          schema:
            minimum: 0
            default: 0
            type: number
        - name: filter
          required: false
          in: query
          description: JSON-encoded filter object
          schema:
            example: '{"offer_id":{"$in":["uuid-1","uuid-2"]},"archive":{"$eq":false}}'
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
