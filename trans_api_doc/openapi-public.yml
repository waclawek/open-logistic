      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreightExtendedReceiversBody"
            examples:
              EMPLOYEE:
                summary: EMPLOYEE
                value:
                  receivers:
                    - type: employee
                      id: 2-172010
                      terms:
                        price:
                          value: 911
                          currency: pln
                        period:
                          payment: deferred
                          days: 360
                        is_first_buy: true
              COMPANY:
                summary: COMPANY
                value:
                  receivers:
                    - type: company
                      id: "105"
                      contact_employees:
                        - 3-123
                        - 3-456
                      terms:
                        price:
                          value: 911
                          currency: pln
                        period:
                          payment: deferred
                          days: 360
                        is_first_buy: true
              COMMUNITY_EXCHANGE:
                summary: COMMUNITY_EXCHANGE
                value:
                  receivers:
                    - type: community_exchange
                      id: 249b28d1-38f5-4a1c-a1ac-fd259d1332a1
                      terms:
                        price:
                          value: 911
                          currency: pln
                        period:
                          payment: deferred
                          days: 360
                        is_first_buy: true
              CORPORATE_EXCHANGE:
                summary: CORPORATE_EXCHANGE
                value:
                  receivers:
                    - type: corporate_exchange
                      id: 249b28d1-38f5-4a1c-a1ac-fd259d1332a3
                      terms:
                        price:
                          value: 911
                          currency: eur
                        period:
                          payment: deferred
                          days: 360
                        is_first_buy: true
              PRIVATE_EXCHANGE:
                summary: PRIVATE_EXCHANGE
                value:
                  receivers:
                    - type: private_exchange
                      id: 249b28d1-38f5-4a1c-a1ac-fd259d1332a4
                      terms:
                        price:
                          value: 911
                          currency: pln
                        period:
                          payment: deferred
                          days: 360
                        is_first_buy: true
              PUBLIC_EXCHANGE:
                summary: PUBLIC_EXCHANGE
                value:
                  receivers:
                    - type: public_exchange
                      terms:
                        price:
                          value: 911
                          currency: pln
                        period:
                          payment: deferred
                          days: 360
                        is_first_buy: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  direct:
                    type: object
                    properties:
                      id:
                        type: string
                        example: e53bce85-a8a5-4a37-bc61-6e93809a3ebd
                      group_id:
                        type: string
                        example: a47bce85-a8a5-4a37-bc61-6e93809a3rty
      security:
        - bearer: []
      summary: Add freight publication receivers
      tags:
        - freights-api
        - Freight publication
