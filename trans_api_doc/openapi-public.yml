                    type: additional_stop
                    kind: value
                    currency: eur
                    description: Additional stop flat fee
                    schedules:
                      - data:
                          matrix:
                            - unit: value
                              value: 150
                        timespan:
                          from: 2032-08-11T00:00:00+02:00
                          to: 2042-09-26T23:59:59+02:00
                    is_global: false
