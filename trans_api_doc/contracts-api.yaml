            - bgn
            - czk
            - gbp
            - huf
            - isk
            - kzt
            - kgs
            - mkd
            - mdl
            - pln
            - ron
            - rub
            - rsd
            - sek
            - chf
            - try
            - uah
            - byn
            - usd
            - hrk
            - dkk
            - nok
