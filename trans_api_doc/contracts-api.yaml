  /ext/contracts-api/v2/contracts:
    get:
      description: Proxy to GET /api/rest/v3/contracts. Context (SHIPPER/CARRIER) is
        resolved automatically from the JWT company roles. Returns downstream
        response with dictionary translations (DICT→ISO) applied.
      operationId: getContractsV2
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            example: 10
            type: number
        - name: offset
          required: false
          in: query
          description: Number of items to skip
          schema:
            example: 0
            type: number
      responses:
        "200":
          description: Contracts list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListV2ResponseDto"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Not found
      security:
        - bearer: []
      summary: Get contracts list (v2)
      tags:
        - contracts-api
