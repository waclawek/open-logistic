paths:
  /ext/contracts-api/v1/contracts:
    get:
      operationId: ContractsReadV1Controller_getList
      parameters:
        - name: context
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            example: 25
            type: number
        - name: offset
          required: false
          in: query
          description: Number of items to skip
          schema:
            example: 0
            type: number
        - name: filter
          required: false
          in: query
          description: Filter object (will be JSON stringified)
          schema:
            example:
              route_id: a9288ec1-6e97-41e7-befb-e81e78125406
            type: object
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractsListResponseDto"
        "401":
          description: ""
        "403":
          description: ""
        "404":
          description: ""
        "424":
          description: ""
      tags:
        - contracts-api
    post:
      description: Create a new contract
      operationId: ContractsManageV1Controller_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractDto"
      responses:
        "201":
          description: Contract created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponseDto"
        "400":
          description: Bad request - invalid input data
        "401":
          description: Unauthorized - authentication required
        "422":
          description: Validation error - input data validation failed
      summary: Create contract
      tags:
        - contracts-api
  /ext/contracts-api/v1/contracts/{uuid}:
