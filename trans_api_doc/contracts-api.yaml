        "401":
          description: ""
        "403":
          description: ""
        "404":
          description: ""
        "424":
          description: ""
      tags:
        - contracts-api
    put:
      description: Update existing contract or create amendment
      operationId: ContractsManageV1Controller_update
      parameters:
        - name: uuid
          required: true
          in: path
          description: Contract UUID
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractDto"
      responses:
        "200":
          description: Contract updated successfully
          content:
            application/json:
